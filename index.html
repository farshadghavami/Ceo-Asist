<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار کسب و کار هوشمند</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- TailwindCSS from CDN for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // or 'media'
        theme: {
          extend: {
            fontFamily: {
              'sans-fa': ['Vazirmatn', 'sans-serif'],
            },
          }
        }
      }
    </script>

    <!-- Scripts -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
        "recharts": "https://aistudiocdn.com/recharts@^3.3.0"
      }
    }
    </script>
    <script type="module" src="/index.tsx"></script>
    
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
        }

        /* Animations and Effects */
        @keyframes fade-in-slide-up {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-slide-up {
            animation: fade-in-slide-up 0.3s ease-out forwards;
        }

        @keyframes fade-in-subtle {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .new-item-animation {
            animation: fade-in-subtle 0.5s ease-out forwards;
        }
        
        @keyframes highlight-bg {
            0% { background-color: rgba(99, 102, 241, 0.2); } /* indigo-500 with opacity */
            100% { background-color: transparent; }
        }
        .highlight {
            animation: highlight-bg 2s ease-out forwards;
        }

        @keyframes just-completed-anim {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .just-completed {
            animation: just-completed-anim 0.8s ease-in-out;
        }
        .just-completed .task-text, .completed .task-text {
            text-decoration: line-through;
            text-decoration-color: #10b981; /* emerald-500 */
            text-decoration-thickness: 2px;
            transition: all 0.5s ease;
        }
        
        /* Aurora background for drag-and-drop */
        .aurora-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(ellipse at top, #6366f1, transparent),
                              radial-gradient(ellipse at bottom, #a855f7, transparent);
            opacity: 0.3;
            filter: blur(20px);
            z-index: 0;
            animation: aurora-anim 5s infinite alternate;
        }
        @keyframes aurora-anim {
             from { transform: scale(1, 1); }
             to { transform: scale(1.5, 1.2); }
        }

        /* Typing indicator for chat */
        .typing-indicator {
            display: flex;
            align-items: center;
        }
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: #9ca3af; /* gray-400 */
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .dark .typing-indicator span {
             background-color: #6b7280; /* gray-500 */
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Custom scrollbar style */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900">
    <noscript>برای اجرای این برنامه باید جاوا اسکریپت را فعال کنید.</noscript>
    <div id="root"></div>
</body>
</html>
